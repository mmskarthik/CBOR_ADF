name: ADF Build

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install packages
        run: npm install

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure Login
        run: az account show

      - name: Validate ADF
        run: |
          npm run build validate \
          ${{ github.workspace }}/adf \
          /subscriptions/${{ secrets.SUBSCRIPTION_ID }}/resourceGroups/${{ secrets.RG_DEV }}/providers/Microsoft.DataFactory/factories/${{ secrets.ADF_DEV }}

      - name: Generate ARM
        run: |
          npm run build export \
          ${{ github.workspace }}/adf \
          /subscriptions/${{ secrets.SUBSCRIPTION_ID }}/resourceGroups/${{ secrets.RG_DEV }}/providers/Microsoft.DataFactory/factories/${{ secrets.ADF_DEV }} \
          ExportedArmTemplate

      - name: Verify exported files
        run: |
          echo "Workspace:"
          pwd

          echo ""
          echo "Exported files:"
          ls -R ExportedArmTemplate

      - name: Upload ARM artifact
        uses: actions/upload-artifact@v4
        with:
          name: adf-arm
          path: ExportedArmTemplate
          retention-days: 30
